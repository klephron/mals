logs:
  - name: stderr
    level: info
    output:
      kind: file
      file: /dev/stderr

models:
  - name: Llama-3.2-1B-Instruct-Q6_K
    api:
      kind: openai
      url: http://localhost:9652

lsps:
  - name: clangd
    api:
      kind: stdio
      cmd:
        - clangd

handlers:
  - name: completion
    kind: lsp/completion
    resources:
      - name: llama
        model: Llama-3.2-1B-Instruct-Q6_K
        scope: client
      - name: clangd
        lsp: clangd
        scope: client
    endpoints:
      initialize:
        default: true
      initialized:
        default: true
      textDocument/didOpen:
        default: true
      textDocument/didChange:
        default: true
      textDocument/didClose:
        default: true
      shutdown:
        default: true
      textDocument/completion:
        default: false
        execution:
          - lsp/completion:
              resource: clangd
            assign: clangd

          - json/dumps:
              input: "{{ .clangd }}"
            assign: clangd_str

          - model/raw:
              resource: llama
              prompt: |
                Write system prompt for model to generate LSP completion list. Model must generate a valid JSON with the type of []string.
            assign: llm_result

          - for:
              condition: "{{ .llm_result }}"
              do:
                - model:
                    resource: llama
                    parameters:
                      schema: json/completionItem
                      max_tokens: 250
                      temperature: 0.8
                    messages:
                      - role: system
                        content: "You are a helpful completion engine. Complete text between <text_before_end> and <text_after_start>. Write only completion results. No decision comments."
                      - role: user
                        content: |
                          Document Path: {{ .file.path }}
                          <text_before_start>
                          {{ .file.text_before }}
                          <text_before_end>
                          <text_after_start>
                          {{ .file.text_before }}
                          <text_after_end>

          - if:
              condition: "{{ .llm_result }}"
              then:
                - json/parse/completion:
                    input: "[{{ .llm_result }}]"
                  assign: completion_json
              else:
                - json/parse/completion:
                    input: "[]"
                  assign: completion_json

          - return: "{{ .completion_json }}"

listeners:
  - name: api-tcp:9650
    ipc:
      kind: tcp
      port: 9650
    protocol:
      kind: api
  - name: lsp-tcp:9651
    ipc:
      kind: tcp
      port: 9651
    protocol:
      kind: lsp
      handlers:
        - name: completion
          condition:
            filetypes: null
            path: null
          handler: completion
