logs:
  - name: stderr
    level: info
    output:
      kind: file
      file: /dev/stderr

models: []
lsps: []

handlers:
  - name: completion
    kind: lsp/completion
    resources:
      - name: llama
        model: Llama-3.2-1B-Instruct-Q6_K
        scope: global
      - name: clangd
        lsp: clangd
        scope: client
    endpoints:
      textDocument/completion:
        default: false
        execution:
          - while:
              condition: "{{ llm_result }}"
              max: 5
              do:
                - model/template:
                    resource: llama
                    prompt: |
                      {{ llm_system.out }}

                      Document info:
                        - path: {{ file.path }}

                      Text:
                      {{ file.text }}

                      Text before:
                      {{ file.text_before }}
                  assign: llm_result

          - if:
              condition: "{{ llm_result }}"
              then:
                - json/parse/completion:
                    input: "{{ llm_result.out }}"
                  assign: completion_json
              else:
                - json/parse/completion:
                    input: "[]"
                  assign: completion_json

          - return: "{{ completion_json.out }}"

listeners: []
