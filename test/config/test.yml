logs:
  - name: stderr
    level: info
    output:
      kind: file
      file: /dev/stderr

models:
  - name: Llama-3.2-1B-Instruct-Q6_K
    api:
      kind: openai
      url: http://localhost:9652
      max_tokens: 250
      temperature: 0.5

lsps:
  - name: clangd
    api:
      kind: stdio
      cmd:
        - clangd

handlers:
  - name: completion
    kind: lsp/completion
    resources:
      - name: llama
        model: Llama-3.2-1B-Instruct-Q6_K
        scope: global
      - name: clangd
        lsp: clangd
        scope: client
    endpoints:
      initialize:
        default: true
      initialized:
        default: true
      textDocument/didOpen:
        default: true
      textDocument/didChange:
        default: true
      textDocument/didClose:
        default: true
      shutdown:
        default: true
      textDocument/completion:
        default: false
        execution:
          - lsp/completion:
              resource: clangd
            assign: clangd

          - json/dumps:
              input: "{{ .clangd }}"
            assign: clangd_str

          - json/parse:
              input: "{{ .clangd_str }}"
            assign: clangd2

          - json/parse/completion:
              input: "{{ .clangd_str }}"
            assign: clangd3

          # - model/raw:
          #     resource: llama
          #     prompt: |
          #       Write sample completion list for LSP.
          #   assign: llama_result

          - return: "{{ .clangd3 }}"

listeners:
  - name: api-tcp:9650
    ipc:
      kind: tcp
      port: 9650
    protocol:
      kind: api
  - name: lsp-tcp:9651
    ipc:
      kind: tcp
      port: 9651
    protocol:
      kind: lsp
      handlers:
        - name: completion
          condition:
            filetypes: null
            path: null
          handler: completion
