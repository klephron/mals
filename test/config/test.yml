logs:
  - name: stderr
    level: info
    output:
      kind: file
      file: /dev/stderr

models:
  - name: Llama-3.2-1B-Instruct-Q6_K
    api:
      kind: openai
      url: http://127.0.0.1:9652
      temperature: 0.5

lsps:
  - name: clangd
    api:
      kind: stdio
      cmd:
        - clangd

handlers:
  - name: completion
    kind: lsp/completion
    resources:
      - name: llama
        model: Llama-3.2-1B-Instruct-Q6_K
        scope: global
      - name: clangd
        lsp: clangd
        scope: client
    endpoints:
      initialize:
        default: true
      initialized:
        default: true
      textDocument/didOpen:
        default: true
      textDocument/didChange:
        default: true
      textDocument/didClose:
        default: true
      shutdown:
        default: true
      textDocument/completion:
        default: false
        execution:
          - lsp/completion:
              resource: clangd
            assign: clangd

          - json/dumps:
              input: "{{ .clangd }}"
            assign: clangd_str

          - model/raw:
              resource: llama
              prompt: |
                Write system prompt for model to generate LSP completion list. Model must generate a valid JSON with the type of []string.
            assign: llm_system

          - assign: do
            for:
              condition: "true"
              max: 1
              do:
                - model:
                    resource: llama
                    schema: json/completionItems
                    prompt: |
                      {{ .llm_system }}

                      Document info:
                        - path: {{ .file.path }}

                      Text:
                      {{ .file.text }}

                      Text before:
                      {{ .file.text_before }}
                  assign: llm_result

          - if:
              condition: "true"
              then:
                - json/parse/completion:
                    input: "{{ .llm_result }}"
                  assign: completion_json
              else:
                - json/parse/completion:
                    input: "[]"
                  assign: completion_json

          - return: "{{ .completion_json }}"

listeners:
  - name: api-tcp:9650
    ipc:
      kind: tcp
      port: 9650
    protocol:
      kind: api
  - name: lsp-tcp:9651
    ipc:
      kind: tcp
      port: 9651
    protocol:
      kind: lsp
      handlers:
        - name: completion
          condition:
            filetypes: null
            path: null
          handler: completion
