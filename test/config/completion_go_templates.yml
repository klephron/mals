logs:
  - name: stderr
    level: info
    output:
      kind: file
      file: /dev/stderr

models:
  - name: model1
    api:
      kind: openai
      url: http://localhost:9652

lsps:
  - name: clangd
    api:
      kind: stdio
      cmd:
        - clangd
        - --clang-tidy
        - --all-scopes-completion

handlers:
  - name: completion
    kind: lsp/completion
    resources:
      - name: model1
        model: model1
        scope: client
      - name: clangd
        lsp: clangd
        scope: client
    endpoints:
      textDocument/completion:
        default: false
        execution:
          - lsp/completion:
              resource: clangd
            assign: clangd

          - json/dumps:
              input: '[{{- range $i, $item := .clangd }}{{- if $i }},{{ end }}{{ printf "%q" $item.Label }} {{- end }}]'
            assign: clangd_str

          - model:
              resource: model1
              parameters:
                schema: json/completionItem
                max_tokens: 250
                temperature: 0.2
              messages:
                - role: system
                  content: "You are an expert code completion AI. ... The cursor is marked with <CURSOR> ..."
                - role: user
                  content: |
                    LSP textDocument/completion results: {{ .clangd_str }}
                - role: user
                  content: |
                    {{ .file.text_before }}<CURSOR>{{ .file.text_after }}
            assign: llm_result

          - json/parse/completion:
              input: "[{{ .llm_result }}]"
            assign: completion_json

          - return: "{{ .completion_json }}"

listeners:
  - name: lsp-tcp:9651
    ipc:
      kind: tcp
      port: 9651
    protocol:
      kind: lsp
      handlers:
        - name: completion
          handler: completion
